[workspace]
resolver = "2"
members = [
  "services/daw-bridge",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LOCK-O-MOTIV"]
repository = "https://github.com/lockomotiv/ableton-studio-toolz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
async-trait = "0.1"
