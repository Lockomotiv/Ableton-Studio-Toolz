name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux – Build, Unit-/Integrations-/E2E-Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System-Abhängigkeiten (Tauri/WebKitGTK, WebDriver, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb
      - run: npm ci
      - run: ./scripts/fetch-abletonosc.sh
      - name: AbletonOSC für den Installer vorbereiten
        run: node scripts/prepare-abletonosc.mjs
      - name: TypeScript-Typprüfung
        run: npm run typecheck
      - name: TypeScript-Tests
        run: npx vitest run
      - name: Rust-Tests (Unit + AbletonOSC-Harness)
        # Harness-Tests nacheinander: jede startet einen eigenen AbletonOSC-Prozess
        run: cargo test --workspace -- --test-threads=1
      - name: App bauen (Debug, eingebettetes Frontend)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      - name: Signalisierungsdienst bauen
        run: cargo build -p lom-signaling
      - name: Playwright + Chromium (nur CI)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: E2E (gebaute App über tauri-driver)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node tests/e2e/run-e2e.mjs
      - name: E2E Zusammenarbeit (2 Teilnehmer, WebRTC)
        run: node tests/e2e/collab-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: |
            docs/screenshots/*.png
            tests/e2e/last-run.json
            tests/e2e/last-collab-run.json

  windows:
    name: Windows – Tests und NSIS-Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: ./scripts/fetch-abletonosc.ps1
        shell: pwsh
      - name: AbletonOSC für den Installer vorbereiten
        run: node scripts/prepare-abletonosc.mjs
      - run: npx vitest run
      - name: Rust-Tests (Unit + AbletonOSC-Harness)
        # Harness-Tests nacheinander: jede startet einen eigenen AbletonOSC-Prozess
        run: cargo test --workspace -- --test-threads=1
      - name: Release-Build + NSIS-Installer
        working-directory: apps/desktop
        run: npx tauri build
      - name: Signalisierungsdienst (Release)
        run: cargo build --release -p lom-signaling
      - name: SHA-256 des Installers
        shell: pwsh
        run: |
          $f = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"
          Write-Host "$h  $($f.Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: connect-studio-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
            docs/schnellstart/Connect-Studio-Schnellstart.pdf
            target/release/connect-studio.exe
            target/release/lom-signaling.exe

  windows-e2e:
    name: Windows – E2E (experimentell)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: ./scripts/fetch-abletonosc.ps1
        shell: pwsh
      - name: AbletonOSC für den Installer vorbereiten
        run: node scripts/prepare-abletonosc.mjs
      - name: App bauen (Debug)
        working-directory: apps/desktop
        run: npx tauri build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      - name: Playwright + Chromium (Gast-Teilnehmer)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Passenden msedgedriver zur WebView2-Version laden
        shell: pwsh
        run: |
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $ver = $null
          foreach ($k in $keys) { if (Test-Path $k) { $ver = (Get-ItemProperty $k).pv; if ($ver) { break } } }
          if (-not $ver) { $ver = (Get-Item "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Host "WebView2/Edge-Version: $ver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver -Force
          echo "TAURI_DRIVER_ARGS=--native-driver $PWD\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
      - name: E2E
        run: node tests/e2e/run-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: |
            docs/screenshots/*.png
            tests/e2e/last-run.json
