# Start auf dem Pi:  ./install-pi.sh   (oder: docker compose up -d --build)
# Einstellungen stehen in ./.env (wird vom Installationsskript angelegt):
#   FAMILYHUB_PORT=8446
#   IMMICH_URL=http://host.docker.internal:2283    # Immich auf demselben Pi
#   IMMICH_API_KEY=…                               # alternativ in der App: Mehr → Fotos
#   IMMICH_INSECURE=1                              # nur bei https mit selbstsigniertem Zertifikat
services:
  familyhub:
    build: .
    container_name: familyhub3
    restart: unless-stopped
    env_file: .env        # wird von install-pi.sh angelegt (sonst: touch .env)
    environment:
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"   # erreicht Immich & Co. auf dem Pi selbst
    volumes:
      - ./data:/data
    ports:
      - "${FAMILYHUB_PORT:-8446}:8080"
